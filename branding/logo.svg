<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2f78"/><stop offset="1" stop-color="#12142a"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#e2562c"/></linearGradient>
    <linearGradient id="cool" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fe3d6"/><stop offset="1" stop-color="#2a7fe0"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="1" stop-color="#f2a900"/></linearGradient>
    <clipPath id="shield"><path id="sp" d="M512 150 L790 230 C790 470 720 650 512 780 C304 650 234 470 234 230 Z"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="150" fill="url(#bg)"/>
  <g stroke="#0b0c1c" stroke-width="12" stroke-linejoin="round">
    <path d="M512 150 L790 230 C790 470 720 650 512 780 C304 650 234 470 234 230 Z" fill="#1b1d3a"/>
    <g clip-path="url(#shield)" stroke="none">
      <rect x="200" y="120" width="312" height="700" fill="url(#warm)"/>
      <rect x="512" y="120" width="312" height="700" fill="url(#cool)"/>
      <path d="M512 120 V820" stroke="#0b0c1c" stroke-width="10"/>
    </g>
    <path d="M512 150 L790 230 C790 470 720 650 512 780 C304 650 234 470 234 230 Z" fill="none"/>
    <path d="M512 150 L790 230 C790 470 720 650 512 780 C304 650 234 470 234 230 Z" fill="none" stroke="url(#gold)" stroke-width="16"/>
  </g>
  <!-- crossed swords -->
  <g stroke="#0b0c1c" stroke-width="8" stroke-linejoin="round">
    <g transform="rotate(40 512 430)">
      <path d="M512 190 L536 250 V560 H488 V250 Z" fill="#f4f6ff"/>
      <rect x="440" y="560" width="144" height="26" rx="8" fill="url(#gold)"/>
      <rect x="498" y="586" width="28" height="80" rx="8" fill="#6b3a1e"/>
      <circle cx="512" cy="684" r="20" fill="url(#gold)"/>
    </g>
    <g transform="rotate(-40 512 430)">
      <path d="M512 190 L536 250 V560 H488 V250 Z" fill="#dfe6ff"/>
      <rect x="440" y="560" width="144" height="26" rx="8" fill="url(#gold)"/>
      <rect x="498" y="586" width="28" height="80" rx="8" fill="#6b3a1e"/>
      <circle cx="512" cy="684" r="20" fill="url(#gold)"/>
    </g>
  </g>
  <text x="512" y="905" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="150" letter-spacing="6" fill="#0b0c1c" stroke="#0b0c1c" stroke-width="22" stroke-linejoin="round">DUO QUEST</text>
  <text x="512" y="905" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="150" letter-spacing="6" fill="url(#gold)">DUO QUEST</text>
  <text x="512" y="975" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="14" fill="#b9bfe8">CO-OP IDLE RPG</text>
